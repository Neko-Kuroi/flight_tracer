<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Radar - Leaflet</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        #map { height: 100vh; width: 100%; }

        #controls {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: white;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            min-width: 260px;
            max-width: 300px;
        }
        #controls input[type="text"] {
            width: 100%;
            padding: 8px 10px;
            margin-bottom: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
        }
        #controls input[type="text"]:focus {
            outline: none;
            border-color: #1a73e8;
        }
        #controls button {
            width: 100%;
            padding: 8px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        #controls button:hover {
            background: #1557b0;
        }
        #controls .info {
            margin-top: 8px;
            font-size: 12px;
            color: #666;
        }
        #controls .error {
            color: #c5221f;
            font-size: 12px;
            margin-top: 6px;
            padding: 6px;
            background: #fce8e8;
            border-radius: 4px;
            display: none;
        }
        #controls .error.visible {
            display: block;
        }

        /* ウォッチリスト */
        .watch-input-row {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
        }
        .watch-input-row input {
            flex: 1;
            margin-bottom: 0 !important;
        }
        .watch-input-row button {
            width: auto !important;
            padding: 8px 12px !important;
        }
        #watchlist-container {
            margin-bottom: 8px;
            min-height: 10px;
        }
        .watch-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #e8f0fe;
            color: #1a73e8;
            border-radius: 12px;
            padding: 3px 8px;
            font-size: 12px;
            margin: 2px 2px 0 0;
            transition: all 0.3s ease;
        }
        .watch-tag.active {
            background: #d4edda;
            color: #155724;
            font-weight: bold;
            box-shadow: 0 0 4px rgba(21, 87, 36, 0.4);
        }
        .watch-tag button {
            all: unset;
            cursor: pointer;
            font-size: 12px;
            line-height: 1;
            width: auto !important;
            padding: 0 !important;
            background: transparent !important;
            color: inherit !important;
            opacity: 0.6;
            margin-left: 4px;
        }
        .watch-tag button:hover {
            opacity: 1;
        }

        .flight-popup {
            min-width: 260px;
        }
        .flight-popup h3 {
            margin: 0 0 8px 0;
            color: #1a73e8;
            font-size: 16px;
        }
        .flight-popup p {
            margin: 4px 0;
            font-size: 13px;
            color: #444;
        }
        .flight-popup .route {
            font-weight: bold;
            color: #333;
            margin: 8px 0;
            font-size: 14px;
        }
        /*
        .flight-popup .icao-info {
            font-size: 11px;
            color: #888;
            margin-top: 6px;
        }
        */
        .flight-popup .loading-note {
            color: #999;
            font-size: 11px;
            margin-top: 6px;
        }
        .flight-icon {
            filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.3));
        }
        .flight-popup .code-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 6px;
            font-size: 12px;
        }
        .flight-popup .icao-badge {
            background: #1a1a1a;
            color: #fff;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            letter-spacing: 0.5px;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
        }
        /*
        .flight-popup .iata-badge {
            color: #666;
            font-family: 'Courier New', monospace;
            font-size: 11px;
        }
        */
        .flight-popup .iata-badge {
            background: #e3f2fd;
            color: #1565c0;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            letter-spacing: 0.5px;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
        }
        .flight-popup .code-arrow {
            color: #bbb;
            font-size: 11px;
        }
        .flight-photo {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid #eee;
            position: relative;
        }
        .flight-photo .photo-close-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 18px;
            height: 18px;
            border: none;
            border-radius: 50%;
            background: rgba(0,0,0,0.55);
            color: #fff;
            font-size: 12px;
            line-height: 18px;
            text-align: center;
            padding: 0;
            cursor: pointer;
            z-index: 10;
        }
        .flight-photo .photo-close-btn:hover {
            background: rgba(0,0,0,0.8);
        }
        .flight-photo a {
            display: block;
            text-decoration: none;
        }
        .flight-photo img {
            width: 100%;
            max-height: 160px;
            object-fit: cover;
            border-radius: 4px;
            display: block;
        }
        .flight-photo .photo-credit {
            margin-top: 4px;
            font-size: 10px;
            color: #999;
            text-align: right;
        }
        .flight-photo .photo-loading,
        .flight-photo .photo-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 60px;
            background: #f5f5f5;
            border-radius: 4px;
            color: #aaa;
            font-size: 11px;
        }
        .flight-photo .photo-spinner {
            width: 12px;
            height: 12px;
            border: 2px solid #ddd;
            border-top-color: #1a73e8;
            border-radius: 50%;
            animation: photo-spin 0.8s linear infinite;
        }
        @keyframes photo-spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // === 地図初期化 ===
        const map = L.map('map').setView([35.6762, 139.6503], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 18
        }).addTo(map);

        const API_BASE = '/api';
        const flightMarkers = {};
        const trailPolylines = {}; // { flightId: L.Polyline }
        let allFlights = [];

        // === ウォッチリスト ===
        let watchList = JSON.parse(localStorage.getItem('flightWatchList') || '[]');
        let watchStatus = {};

        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }

        function saveWatchList() {
            localStorage.setItem('flightWatchList', JSON.stringify(watchList));
        }

        function addToWatchlist() {
            const input = document.getElementById('watch-input');
            const value = input.value.trim().toUpperCase();
            if (!value) return;
            if (watchList.includes(value)) {
                input.value = '';
                return;
            }
            watchList.push(value);
            watchStatus[value] = false;
            saveWatchList();
            input.value = '';
            renderWatchList();
        }

        function removeFromWatchlist(value) {
            watchList = watchList.filter(v => v !== value);
            delete watchStatus[value];
            saveWatchList();
            renderWatchList();
        }

        function renderWatchList() {
            const container = document.getElementById('watchlist-container');
            container.innerHTML = watchList.map(v => {
                const active = watchStatus[v];
                return `<span class="watch-tag ${active ? 'active' : ''}">
                    ${active ? '🟢' : '⚪'} ${v}
                    <button onclick="removeFromWatchlist('${v}')" title="監視解除">✕</button>
                </span>`;
            }).join('');
        }

        function checkWatchList(flights) {
            if (watchList.length === 0) return;
            const detectedNow = new Set();
            flights.forEach(f => {
                const callsign = (f.callsign || '').toUpperCase();
                const registration = (f.registration || '').toUpperCase();
                watchList.forEach(w => {
                    if (callsign === w || registration === w) detectedNow.add(w);
                });
            });
            watchList.forEach(w => {
                const wasActive = watchStatus[w];
                const isActive = detectedNow.has(w);
                if (!wasActive && isActive) {
                    notify(`✈️ ${w} を検知しました`, '監視中の機体がレーダーに現れました');
                } else if (wasActive && !isActive) {
                    notify(`📡 ${w} をロストしました`, 'レーダー範囲外に出た可能性があります');
                }
                watchStatus[w] = isActive;
            });
            renderWatchList();
        }

        function notify(title, body) {
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification(title, { body });
            }
            console.log(`[通知] ${title}: ${body}`);
        }

        // === フライト表示 ===
        function createPlaneIcon(heading) {
            const h = heading || 0;
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
                style="transform: rotate(${h}deg); transform-origin: center;">
                <path fill="#e74c3c" d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
            </svg>`;
            return L.divIcon({
                html: svg,
                className: 'flight-icon',
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });
        }

        function showError(msg) {
            const el = document.getElementById('error-msg');
            if (msg) {
                el.textContent = msg;
                el.classList.add('visible');
            } else {
                el.classList.remove('visible');
            }
        }

        // === bounds(地図の表示範囲)取得 ===
        function normalizeLng(lng) {
            // -180〜180の範囲に正規化
            return ((lng + 180) % 360 + 360) % 360 - 180;
        }
        
        function getCurrentBoundsParam() {
            if (activeRegionBounds) {
                const r = activeRegionBounds;
                return `${r.tl_y},${r.tl_x},${r.br_y},${r.br_x}`;
            }
            const b = map.getBounds();
            const tl_y = b.getNorth();
            const tl_x = normalizeLng(b.getWest());
            const br_y = b.getSouth();
            const br_x = normalizeLng(b.getEast());
            return `${tl_y},${tl_x},${br_y},${br_x}`;
        }
        
        /*
        function getCurrentBoundsParam() {
            const b = map.getBounds();
            const tl_y = b.getNorth();
            const tl_x = normalizeLng(b.getWest());
            const br_y = b.getSouth();
            const br_x = normalizeLng(b.getEast());
            return `${tl_y},${tl_x},${br_y},${br_x}`;
        }
        */
        
        /*

            const b = map.getBounds();
            const tl_y = b.getNorth();
            const tl_x = b.getWest();
            const br_y = b.getSouth();
            const br_x = b.getEast();
            return `${tl_y},${tl_x},${br_y},${br_x}`;
        }
        */
        
        let activeRegionBounds = null; // リージョン選択中はこちらを優先
        
const REGIONS = {
    japan:         { tl_y: 46, tl_x: 122, br_y: 24, br_x: 146 },   // area=528
    us_west:       { tl_y: 49, tl_x: -125, br_y: 32, br_x: -114 }, // area=187
    us_east:       { tl_y: 47, tl_x: -85,  br_y: 25, br_x: -66 },  // area=418
    south_america: { tl_y: -10, tl_x: -58, br_y: -35, br_x: -38 }, // area=500
    europe:        { tl_y: 55, tl_x: -5,   br_y: 36, br_x: 25 },   // area=570
    middle_east:   { tl_y: 35, tl_x: 35,   br_y: 15, br_x: 58 },   // area=460

    southeast_asia_w: { tl_y: 20, tl_x: 95,  br_y: 0,  br_x: 108 },  // area=260 (タイ・ベトナム方面)

    mexico_centam:    { tl_y: 25, tl_x: -105,br_y: 8,  br_x: -80 },  // area=425
    china_east:       { tl_y: 42, tl_x: 108, br_y: 20, br_x: 125 },  // area=374
};
const REGION_LABELS = {
    japan: '日本', us_west: 'アメリカ西海岸', us_east: 'アメリカ東海岸',
    south_america: '南米', europe: '西ヨーロッパ', middle_east: '中東',
    africa_north: '北アフリカ', africa_south: '南部アフリカ',
    east_asia: '東アジア', oceania: 'オセアニア',
    // 追加分
    south_asia: '南アジア(インド)',
    southeast_asia_w: '東南アジア西部',
    southeast_asia_e: '東南アジア東部',
    uk_ireland: '英国・アイルランド',
    russia_west: 'ロシア西部',
    canada_east: 'カナダ東部',
    mexico_centam: 'メキシコ・中米',
    china_east: '中国東部',
};

function findNearestRegion(lat, lng) {
    let nearest = null;
    let minDist = Infinity;
    for (const [key, r] of Object.entries(REGIONS)) {
        const centerLat = (r.tl_y + r.br_y) / 2;
        const centerLng = (r.tl_x + r.br_x) / 2;
        const dist = Math.sqrt((lat - centerLat) ** 2 + (lng - centerLng) ** 2);
        if (dist < minDist) {
            minDist = dist;
            nearest = key;
        }
    }
    return nearest;
}

async function searchByRegistration() {
    const input = document.getElementById('registration-search');
    const registration = input.value.trim().toUpperCase();
    if (!registration) return;

    showError('');
    try {
        const response = await fetch(`${API_BASE}/search?registration=${encodeURIComponent(registration)}`);
        if (!response.ok) {
            const data = await response.json();
            throw new Error(data.detail || data.error || `HTTP ${response.status}`);
        }
        const flight = await response.json();

        map.setView([flight.lat, flight.lng], 8);

        const nearestRegion = findNearestRegion(flight.lat, flight.lng);
        const regionLabel = REGION_LABELS[nearestRegion] || '不明';

        alert(`${registration} を検出しました(${flight.callsign || 'コールサイン不明'})\n最寄りリージョン: ${regionLabel}`);
    } catch (error) {
        console.error('登録番号検索エラー:', error);
        showError(`検索失敗: ${error.message}`);
    }
}function findNearestRegion(lat, lng) {

    const input = document.getElementById('registration-search');
    const registration = input.value.trim().toUpperCase();
    if (!registration) return;

    showError('');
    try {
        const response = await fetch(`${API_BASE}/search?registration=${encodeURIComponent(registration)}`);
        if (!response.ok) {

        alert(`${registration} を検出しました(${flight.callsign || 'コールサイン不明'})\n最寄りリージョン: ${regionLabel}`);
    } catch (error) {
        console.error('登録番号検索エラー:', error);
        showError(`検索失敗: ${error.message}`);
    }
}
        function jumpToRegion(key) {
            const r = REGIONS[key];
            if (!r) return;
            activeRegionBounds = r;  // ← この1行を追加
            const bounds = L.latLngBounds([r.br_y, r.tl_x], [r.tl_y, r.br_x]);
            map.fitBounds(bounds);
        }

        async function fetchFlights() {
            try {
                showError('');
                const boundsParam = getCurrentBoundsParam();
                const response = await fetch(`${API_BASE}/flights?bounds=${encodeURIComponent(boundsParam)}`);
                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.detail || data.error || `HTTP ${response.status}`);
                }
                const flights = await response.json();

                allFlights = flights;
                filterFlights();
                checkWatchList(flights);

                document.getElementById('last-update').textContent =
                    `最終更新: ${new Date().toLocaleTimeString()}`;
            } catch (error) {
                console.error('フライト取得エラー:', error);
                showError(`取得失敗: ${error.message}`);
            }
        }

        function filterFlights() {
            const query = document.getElementById('search-box').value.trim().toLowerCase();
            const filtered = query
                ? allFlights.filter(f => {
                    const text = `${f.callsign || ''} ${f.airline || ''} ${f.aircraft || ''} ${f.registration || ''}`.toLowerCase();
                    return text.includes(query);
                  })
                : allFlights;
            updateMap(filtered);
            updateInfo(filtered.length, allFlights.length, query);
        }

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
}

function buildPhotoSection(photoState, flightId, dismissed) {
    if (!photoState || dismissed) return '';

    if (photoState.status === 'loading') {
        return `
            <div class="flight-photo">
                <div class="photo-loading"><span class="photo-spinner"></span>写真を確認中...</div>
            </div>
        `;
    }

    if (photoState.status === 'found') {
        const isSafeUrl = (u) => typeof u === 'string' && /^https?:\/\//i.test(u);
        if (!isSafeUrl(photoState.thumbnail_url)) return '';

        const url = escapeHtml(photoState.thumbnail_url);
        const link = isSafeUrl(photoState.link) ? escapeHtml(photoState.link) : '#';
        const photographer = escapeHtml(photoState.photographer || 'Unknown');
        const safeFlightId = escapeHtml(String(flightId));
        return `
            <div class="flight-photo">
                <button class="photo-close-btn" data-flight-id="${safeFlightId}" onclick="dismissAircraftPhoto(this.dataset.flightId)" title="写真を閉じる">×</button>
                <a href="${link}" target="_blank" rel="noopener noreferrer">
                    <img src="${url}" alt="機体写真" loading="lazy">
                    <div class="photo-credit">Photo by ${photographer} / planespotters.net</div>
                </a>
            </div>
        `;
    }

    // status === 'notfound'
    const safeFlightId = escapeHtml(String(flightId));
    return `
        <div class="flight-photo">
            <button class="photo-close-btn" data-flight-id="${safeFlightId}" onclick="dismissAircraftPhoto(this.dataset.flightId)" title="閉じる">×</button>
            <div class="photo-placeholder">📷 写真なし</div>
        </div>
    `;
}

function buildPopupContent(flight, loading = false, photoState = null, photoDismissed = false) {
    const codeRow = (flight.origin_icao || flight.origin_iata)
        ? `
            <div class="code-row">
                <span class="icao-badge">${flight.origin_icao || '----'}</span>
                <span class="iata-badge">${flight.origin_iata || '-'}</span>
                <span class="code-arrow">→</span>
                <span class="icao-badge">${flight.destination_icao || '----'}</span>
                <span class="iata-badge">${flight.destination_iata || '-'}</span>
            </div>
        `
        : '';

    return `
        <div class="flight-popup">
            <h3>✈️ ${flight.callsign || 'Unknown'}</h3>
            <p><strong>航空会社:</strong> ${flight.airline || 'Unknown'}</p>
            <p><strong>機種:</strong> ${flight.aircraft || 'Unknown'}</p>
            <p><strong>登録番号:</strong> ${flight.registration || 'N/A'}</p>
            <div class="route">${flight.origin || 'N/A'} → ${flight.destination || 'N/A'}</div>
            <p><strong>高度:</strong> ${flight.altitude ? flight.altitude + ' ft' : 'N/A'}</p>
            <p><strong>速度:</strong> ${flight.speed ? flight.speed + ' kts' : 'N/A'}</p>
            <p><strong>方位:</strong> ${flight.heading || 0}°</p>
            ${codeRow}
            ${loading ? '<p class="loading-note">詳細情報を取得中...</p>' : ''}
            ${buildPhotoSection(photoState, flight.id, photoDismissed)}
        </div>
    `;
}

//            const icaoInfo = flight.origin_icao && flight.destination_icao
//                ? `<p class="icao-info">ICAO: ${flight.origin_icao} → ${flight.destination_icao}</p>`
//                : '';
//
//            return `
//                <div class="flight-popup">
//                    <h3>✈️ ${flight.callsign || 'Unknown'}</h3>
//                    <p><strong>航空会社:</strong> ${flight.airline || 'Unknown'}</p>
//                    <p><strong>機種:</strong> ${flight.aircraft || 'Unknown'}</p>
//                    <p><strong>登録番号:</strong> ${flight.registration || 'N/A'}</p>
//                    <div class="route">${flight.origin || 'N/A'} → ${flight.destination || 'N/A'}</div>
//                    <p><strong>高度:</strong> ${flight.altitude ? flight.altitude + ' ft' : 'N/A'}</p>
//                    <p><strong>速度:</strong> ${flight.speed ? flight.speed + ' kts' : 'N/A'}</p>
//                    <p><strong>方位:</strong> ${flight.heading || 0}°</p>
//                    ${icaoInfo}
//                    ${loading ? '<p class="loading-note">詳細情報を取得中...</p>' : ''}
//                </div>
//            `;
//        }

        // === 航跡(ポリライン)描画 ===
        function drawTrail(flightId, trailPoints) {
            removeTrail(flightId);

            if (!trailPoints || trailPoints.length < 2) return;

            const latlngs = trailPoints
                .filter(p => p.lat != null && p.lng != null)
                .map(p => [p.lat, p.lng]);

            if (latlngs.length < 2) return;

            const polyline = L.polyline(latlngs, {
                color: '#1a73e8',
                weight: 3,
                opacity: 0.7,
                dashArray: '6, 6'
            }).addTo(map);

            trailPolylines[flightId] = polyline;
        }

        function removeTrail(flightId) {
            if (trailPolylines[flightId]) {
                map.removeLayer(trailPolylines[flightId]);
                delete trailPolylines[flightId];
            }
        }

        // registration -> photoState のキャッシュ({status:'found'|'notfound', ...})
        // 同じ機体を何度ポップアップ開閉しても再取得しないためのクライアント側キャッシュ
        // (サーバー側にも24時間キャッシュがあるので二重防御)
        const photoCache = new Map();

        function renderPopup(marker) {
            marker.setPopupContent(
                buildPopupContent(marker._currentFlight, marker._detailLoading, marker._photoState, marker._photoDismissed)
            );
        }

        function dismissAircraftPhoto(flightId) {
            const marker = flightMarkers[flightId];
            if (!marker) return;
            marker._photoDismissed = true;
            // 重要: setPopupContent()をこのクリックハンドラ内で同期的に呼ぶと、
            // Leafletがクリックされた要素からポップアップの外枠まで親を辿って
            // 「ポップアップ内のクリックか」を判定する処理より先にDOMが
            // 差し替えられてしまい、判定に失敗してポップアップごと閉じてしまう。
            // 1tick遅らせることでLeaflet側の判定を先に完了させる。
            setTimeout(() => renderPopup(marker), 0);
        }

        async function loadAircraftPhoto(registration, marker) {
            const reg = (registration || '').trim().toUpperCase();

            if (!reg || reg === 'N/A') {
                marker._photoState = { status: 'notfound' };
                renderPopup(marker);
                return;
            }

            if (photoCache.has(reg)) {
                marker._photoState = photoCache.get(reg);
                renderPopup(marker);
                return;
            }

            marker._photoState = { status: 'loading' };
            renderPopup(marker);

            let result;
            try {
                const response = await fetch(`${API_BASE}/photo/${encodeURIComponent(reg)}`);
                if (!response.ok) {
                    result = { status: 'notfound' };
                } else {
                    const data = await response.json();
                    result = data.found
                        ? {
                            status: 'found',
                            thumbnail_url: data.thumbnail_url,
                            photographer: data.photographer,
                            link: data.link,
                          }
                        : { status: 'notfound' };
                }
            } catch (error) {
                console.error('写真取得エラー:', error);
                result = { status: 'notfound' };
            }

            photoCache.set(reg, result);

            // ポップアップが閉じられていても marker._photoState 自体は更新しておく
            // (再度開いたときにキャッシュとして即反映される)
            marker._photoState = result;
            if (marker.isPopupOpen()) {
                renderPopup(marker);
            }
        }

        async function loadFlightDetails(flightId, marker) {
            try {
                const boundsParam = getCurrentBoundsParam();
                const response = await fetch(`${API_BASE}/flight/${flightId}?bounds=${encodeURIComponent(boundsParam)}`);
                if (!response.ok) return; // 失敗時は基本情報のまま(フォールバック)
                const detail = await response.json();
                marker._currentFlight = detail;
                marker._detailLoading = false;
                renderPopup(marker);
                drawTrail(flightId, detail.trail);
            } catch (error) {
                console.error('詳細取得エラー:', error);
                marker._detailLoading = false;
                renderPopup(marker);
            }
        }

        function updateMap(flights) {
            const currentIds = new Set(flights.map(f => f.id));
            for (const id in flightMarkers) {
                if (!currentIds.has(id)) {
                    map.removeLayer(flightMarkers[id]);
                    delete flightMarkers[id];
                    removeTrail(id);
                }
            }
            flights.forEach(flight => {
                const pos = [flight.lat, flight.lng];
                const heading = flight.heading || 0;
                if (flightMarkers[flight.id]) {
                    flightMarkers[flight.id].setLatLng(pos);
                    flightMarkers[flight.id].setIcon(createPlaneIcon(heading));
                    flightMarkers[flight.id]._basicFlight = flight;
                } else {
                    const marker = L.marker(pos, { icon: createPlaneIcon(heading) }).addTo(map);
                    marker._basicFlight = flight;
                    marker._currentFlight = flight;
                    marker._detailLoading = false;
                    marker._photoState = null;
                    marker._photoDismissed = false;
                    marker.bindPopup(buildPopupContent(flight));

                    marker.on('popupopen', () => {
                        marker._currentFlight = marker._basicFlight;
                        marker._detailLoading = true;
                        marker._photoDismissed = false;
                        renderPopup(marker);

                        loadFlightDetails(flight.id, marker);
                        loadAircraftPhoto(marker._basicFlight.registration, marker);
                    });

                    marker.on('popupclose', () => {
                        removeTrail(flight.id);
                    });

                    flightMarkers[flight.id] = marker;
                }
            });
        }

        function updateInfo(filteredCount, totalCount, query) {
            const el = document.getElementById('flight-count');
            if (query) {
                el.textContent = `表示: ${filteredCount} / 全${totalCount}件`;
            } else {
                el.textContent = `フライト数: ${totalCount}`;
            }
        }

        function refreshFlights() {
            fetchFlights();
        }

        // === 地図移動・ズーム時の再取得(デバウンス付き) ===
        let moveDebounceTimer = null;
        function onMapMoveEnd() {
            activeRegionBounds = null;  // ← この1行を追加(手動操作でリージョン固定を解除)
            clearTimeout(moveDebounceTimer);
            moveDebounceTimer = setTimeout(() => {
                fetchFlights();
            }, 800);
        }
        map.on('moveend', onMapMoveEnd);
        map.on('zoomend', onMapMoveEnd);

        setInterval(fetchFlights, 30000);
        renderWatchList();
        fetchFlights();
    </script>
