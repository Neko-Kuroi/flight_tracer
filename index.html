<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Radar - Leaflet</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        #map { height: 100vh; width: 100%; }

        #controls {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: white;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            min-width: 260px;
            max-width: 300px;
        }
        #controls input[type="text"] {
            width: 100%;
            padding: 8px 10px;
            margin-bottom: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
        }
        #controls input[type="text"]:focus {
            outline: none;
            border-color: #1a73e8;
        }
        #controls button {
            width: 100%;
            padding: 8px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        #controls button:hover {
            background: #1557b0;
        }
        #controls .info {
            margin-top: 8px;
            font-size: 12px;
            color: #666;
        }
        #controls .error {
            color: #c5221f;
            font-size: 12px;
            margin-top: 6px;
            padding: 6px;
            background: #fce8e8;
            border-radius: 4px;
            display: none;
        }
        #controls .error.visible {
            display: block;
        }

        /* ウォッチリスト */
        .watch-input-row {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
        }
        .watch-input-row input {
            flex: 1;
            margin-bottom: 0 !important;
        }
        .watch-input-row button {
            width: auto !important;
            padding: 8px 12px !important;
        }
        #watchlist-container {
            margin-bottom: 4px;
            min-height: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .watchlist-pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 12px;
            color: #666;
        }
        .watchlist-pagination button {
            width: auto !important;
            padding: 2px 10px !important;
            font-size: 12px;
        }
        .watchlist-pagination button:disabled {
            opacity: 0.4;
            cursor: default;
        }
        .watch-tag {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
            background: #e8f0fe;
            color: #1a73e8;
            border-radius: 12px;
            padding: 3px 8px;
            font-size: 12px;
            transition: all 0.3s ease;
        }
        .watch-tag.active {
            background: #d4edda;
            color: #155724;
            font-weight: bold;
            box-shadow: 0 0 4px rgba(21, 87, 36, 0.4);
        }
        .watch-tag button {
            all: unset;
            cursor: pointer;
            font-size: 12px;
            line-height: 1;
            width: auto !important;
            padding: 0 !important;
            background: transparent !important;
            color: inherit !important;
            opacity: 0.6;
            margin-left: 4px;
        }
        .watch-tag button:hover {
            opacity: 1;
        }

        /* Leafletポップアップ本体:すりガラス(グラスモーフィズム)効果 */
        .leaflet-popup-content-wrapper {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(12px);
        }
        .leaflet-popup-tip {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }

        .flight-popup {
            min-width: 260px;
        }
        .flight-popup h3 {
            margin: 0 0 8px 0;
            color: #1a73e8;
            font-size: 16px;
        }
        .flight-popup p {
            margin: 4px 0;
            font-size: 13px;
            color: #444;
        }
        .flight-popup .route {
            font-weight: bold;
            color: #333;
            margin: 8px 0;
            font-size: 14px;
        }
        /*
        .flight-popup .icao-info {
            font-size: 11px;
            color: #888;
            margin-top: 6px;
        }
        */
        .flight-popup .loading-note {
            color: #999;
            font-size: 11px;
            margin-top: 6px;
        }
        .flight-icon {
            filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.3));
        }
        .flight-popup .code-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 6px;
            font-size: 12px;
        }
        .flight-popup .icao-badge {
            background: #1a1a1a;
            color: #fff;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            letter-spacing: 0.5px;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
        }
        /*
        .flight-popup .iata-badge {
            color: #666;
            font-family: 'Courier New', monospace;
            font-size: 11px;
        }
        */
        .flight-popup .iata-badge {
            background: #e3f2fd;
            color: #1565c0;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            letter-spacing: 0.5px;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
        }
        .flight-popup .code-arrow {
            color: #bbb;
            font-size: 11px;
        }
        .flight-photo {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid #eee;
            position: relative;
        }
        .flight-photo .photo-close-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 18px;
            height: 18px;
            border: none;
            border-radius: 50%;
            background: rgba(0,0,0,0.55);
            color: #fff;
            font-size: 12px;
            line-height: 18px;
            text-align: center;
            padding: 0;
            cursor: pointer;
            z-index: 10;
        }
        .flight-photo .photo-close-btn:hover {
            background: rgba(0,0,0,0.8);
        }
        .watch-tooltip {
            background: #000 !important;
            color: #fff !important;
            border: none !important;
            border-radius: 4px;
            font-weight: 700;
            font-size: 12px;
            padding: 3px 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.4);
        }
        .watch-tooltip::before {
            border-top-color: #000 !important;
        }
        .flight-photo a {
            display: block;
            text-decoration: none;
        }
        .flight-photo img {
            width: 100%;
            max-height: 160px;
            object-fit: cover;
            border-radius: 4px;
            display: block;
        }
        .flight-photo .photo-credit {
            margin-top: 4px;
            font-size: 10px;
            color: #999;
            text-align: right;
        }
        .flight-photo .photo-loading,
        .flight-photo .photo-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 60px;
            background: #f5f5f5;
            border-radius: 4px;
            color: #aaa;
            font-size: 11px;
        }
        .flight-photo .photo-spinner {
            width: 12px;
            height: 12px;
            border: 2px solid #ddd;
            border-top-color: #1a73e8;
            border-radius: 50%;
            animation: photo-spin 0.8s linear infinite;
        }
        @keyframes photo-spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="controls">
        <select id="region-select" onchange="jumpToRegion(this.value)" style="width:100%; padding:8px; margin-bottom:8px; border:1px solid #ccc; border-radius:4px; font-size:13px;">
            <option value="japan">🇯🇵 日本</option>
            <option value="us_west">🇺🇸 アメリカ西海岸</option>
            <option value="us_east">🇺🇸 アメリカ東海岸</option>
            <option value="south_america">🇧🇷 南米(ブラジル・アルゼンチン)</option>
            <option value="europe">🇪🇺 西ヨーロッパ</option>
            <option value="middle_east">🌍 中東</option>
            <option value="africa_north">🇪🇬 北アフリカ</option>
            <option value="africa_south">🇿🇦 南部アフリカ</option>
            <option value="east_asia">🌏 東アジア</option>
            <option value="oceania">🇦🇺 オセアニア</option>
            <option value="south_asia">🇮🇳 南アジア(インド)</option>
            <option value="southeast_asia_w">🇹🇭 東南アジア西部(タイ・ベトナム)</option>
            <option value="southeast_asia_e">🇵🇭 東南アジア東部(フィリピン・インドネシア)</option>
            <option value="uk_ireland">🇬🇧 英国・アイルランド</option>
            <option value="russia_west">🇷🇺 ロシア西部(モスクワ方面)</option>
            <option value="canada_east">🇨🇦 カナダ東部</option>
            <option value="mexico_centam">🇲🇽 メキシコ・中米</option>
            <option value="china_east">🇨🇳 中国東部(上海・北京方面)</option>
        </select>
        <input type="text" id="search-box" placeholder="コールサイン・航空会社・機種で検索" oninput="filterFlights()">
        
        <div class="watch-input-row">
            <input type="text" id="registration-search" placeholder="登録番号で検索 (例: N221EG)" onkeydown="if(event.key==='Enter')searchByRegistration()">
            <button onclick="searchByRegistration()">🔍</button>
        </div>

        <div class="watch-input-row">
            <input type="text" id="watch-input" placeholder="コールサイン/登録番号を監視" onkeydown="if(event.key==='Enter')addToWatchlist()">
            <button onclick="addToWatchlist()">＋</button>
        </div>

        <div id="watchlist-container"></div>
        <div id="watchlist-pagination" class="watchlist-pagination"></div>

        <button onclick="refreshFlights()">🔄 更新</button>
        <div class="info" id="flight-count">フライト数: -</div>
        <div class="info" id="last-update">最終更新: -</div>
        <div class="error" id="error-msg"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // === 地図初期化 ===
        const map = L.map('map').setView([35.6762, 139.6503], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 18
        }).addTo(map);

        const API_BASE = '/api';
        const flightMarkers = {};
        const trailPolylines = {}; // { flightId: L.Polyline[] }(高度ごとにセグメント分割するため配列)
        let allFlights = [];

        // === ウォッチリスト ===
        let watchList = JSON.parse(localStorage.getItem('flightWatchList') || '[]');
        let watchStatus = {};

        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }

        function saveWatchList() {
            localStorage.setItem('flightWatchList', JSON.stringify(watchList));
        }

        const WATCH_LIST_MAX = 250;
        const WATCH_PAGE_SIZE = 5;
        let watchListPage = 0; // 0始まり

        function addToWatchlist() {
            const input = document.getElementById('watch-input');
            const value = input.value.trim().toUpperCase();
            if (!value) return;
            if (watchList.includes(value)) {
                input.value = '';
                return;
            }
            if (watchList.length >= WATCH_LIST_MAX) {
                alert(`監視できる機体は最大${WATCH_LIST_MAX}件までです`);
                return;
            }
            watchList.push(value);
            watchStatus[value] = false;
            saveWatchList();
            input.value = '';
            // 追加した項目が見えるよう最終ページへ移動
            watchListPage = Math.max(0, Math.ceil(watchList.length / WATCH_PAGE_SIZE) - 1);
            renderWatchList();
        }

        function removeFromWatchlist(value) {
            watchList = watchList.filter(v => v !== value);
            delete watchStatus[value];
            saveWatchList();
            renderWatchList();

            // 次のポーリングを待たず、該当機体のtooltipがあれば即座に消す
            for (const id in flightMarkers) {
                const marker = flightMarkers[id];
                const f = marker._basicFlight;
                if (!f) continue;
                const matches = (f.callsign || '').toUpperCase() === value ||
                                 (f.registration || '').toUpperCase() === value;
                if (matches && marker.getTooltip()) {
                    marker.unbindTooltip();
                    delete marker._watchTooltipLabel;
                    watchTooltipMarkerIds.delete(id);
                }
            }
        }

        function renderWatchList() {
            const totalPages = Math.max(1, Math.ceil(watchList.length / WATCH_PAGE_SIZE));
            if (watchListPage >= totalPages) watchListPage = totalPages - 1;
            if (watchListPage < 0) watchListPage = 0;

            const start = watchListPage * WATCH_PAGE_SIZE;
            const pageItems = watchList.slice(start, start + WATCH_PAGE_SIZE);

            const container = document.getElementById('watchlist-container');
            container.innerHTML = pageItems.map(v => {
                const active = watchStatus[v];
                const safeValue = escapeHtml(v);
                return `<span class="watch-tag ${active ? 'active' : ''}">
                    <span>${active ? '🟢' : '⚪'} ${safeValue}</span>
                    <button data-value="${safeValue}" onclick="removeFromWatchlist(this.dataset.value)" title="監視解除">✕</button>
                </span>`;
            }).join('');

            const paginationEl = document.getElementById('watchlist-pagination');
            if (watchList.length === 0) {
                paginationEl.innerHTML = '';
            } else if (watchList.length <= WATCH_PAGE_SIZE) {
                paginationEl.innerHTML = `<span>${watchList.length}/${WATCH_LIST_MAX}件</span>`;
            } else {
                paginationEl.innerHTML = `
                    <button onclick="watchListPrevPage()" ${watchListPage === 0 ? 'disabled' : ''}>◀</button>
                    <span>${watchListPage + 1} / ${totalPages}ページ (${watchList.length}/${WATCH_LIST_MAX}件)</span>
                    <button onclick="watchListNextPage()" ${watchListPage >= totalPages - 1 ? 'disabled' : ''}>▶</button>
                `;
            }
        }

        function watchListPrevPage() {
            if (watchListPage > 0) {
                watchListPage--;
                renderWatchList();
            }
        }

        function watchListNextPage() {
            const totalPages = Math.max(1, Math.ceil(watchList.length / WATCH_PAGE_SIZE));
            if (watchListPage < totalPages - 1) {
                watchListPage++;
                renderWatchList();
            }
        }

        // 監視tooltipが現在表示されているマーカーのflight.idを保持
        // (次回チェック時に「監視対象から外れた/ロストした」マーカーのtooltipを消すため)
        let watchTooltipMarkerIds = new Set();

        // 登録番号検索でヒットした機体コード。監視リストには入れないが、
        // 見つかっている間はwatchListと同じ黒tooltipで地図上に表示する。
        let searchHighlightValue = null;

        function checkWatchList(flights) {
            const tooltipTargets = new Set(watchList);
            if (searchHighlightValue) tooltipTargets.add(searchHighlightValue);

            const detectedNow = new Set();
            const matchedFlightByWatch = {}; // 対象コード -> 該当flightオブジェクト
            if (tooltipTargets.size > 0) {
                flights.forEach(f => {
                    const callsign = (f.callsign || '').toUpperCase();
                    const registration = (f.registration || '').toUpperCase();
                    tooltipTargets.forEach(w => {
                        if (callsign === w || registration === w) {
                            detectedNow.add(w);
                            matchedFlightByWatch[w] = f;
                        }
                    });
                });
            }

            // 通知・サイドバーのステータス更新は監視リスト(watchList)のみが対象。
            // 検索ハイライトは一時的な表示なので通知やタグ表示は行わない。
            watchList.forEach(w => {
                const wasActive = watchStatus[w];
                const isActive = detectedNow.has(w);
                if (!wasActive && isActive) {
                    notify(`✈️ ${w} を検知しました`, '監視中の機体がレーダーに現れました');
                } else if (wasActive && !isActive) {
                    notify(`📡 ${w} をロストしました`, 'レーダー範囲外に出た可能性があります');
                }
                watchStatus[w] = isActive;
            });
            renderWatchList();
            updateWatchTooltips(matchedFlightByWatch);
        }

        function watchTooltipLabel(flight, watchValue) {
            if (flight.registration && flight.registration !== 'N/A') return flight.registration;
            return flight.callsign || watchValue;
        }

        // 監視中で検出されている機体のマーカーに、黒背景・白文字のtooltipを
        // bindTooltip(permanent:true)で表示する。permanent tooltipはLeaflet側で
        // マーカーのsetLatLng()に自動追従するため、追従用の特別な処理は不要。
        function updateWatchTooltips(matchedFlightByWatch) {
            const newActiveIds = new Set();

            Object.keys(matchedFlightByWatch).forEach(w => {
                const flight = matchedFlightByWatch[w];
                const marker = flightMarkers[flight.id];
                if (!marker) return; // 検索フィルタ等でマーカーが地図上に無い場合はスキップ

                const label = watchTooltipLabel(flight, w);
                newActiveIds.add(flight.id);

                if (marker._watchTooltipLabel !== label) {
                    if (marker.getTooltip()) {
                        marker.setTooltipContent(label);
                    } else {
                        marker.bindTooltip(label, {
                            permanent: true,
                            direction: 'top',
                            offset: [0, -12],
                            className: 'watch-tooltip'
                        }).openTooltip();
                    }
                    marker._watchTooltipLabel = label;
                }
            });

            // 監視対象から外れた/ロストしたマーカーのtooltipを除去
            watchTooltipMarkerIds.forEach(id => {
                if (!newActiveIds.has(id)) {
                    const marker = flightMarkers[id];
                    if (marker && marker.getTooltip()) {
                        marker.unbindTooltip();
                        delete marker._watchTooltipLabel;
                    }
                }
            });

            watchTooltipMarkerIds = newActiveIds;
        }

        function clearAllWatchTooltips() {
            watchTooltipMarkerIds.forEach(id => {
                const marker = flightMarkers[id];
                if (marker && marker.getTooltip()) {
                    marker.unbindTooltip();
                    delete marker._watchTooltipLabel;
                }
            });
            watchTooltipMarkerIds = new Set();
        }

        function notify(title, body) {
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification(title, { body });
            }
            console.log(`[通知] ${title}: ${body}`);
        }

        // === フライト表示 ===
        // tar1090(html/defaults.js)のColorByAlt.air.hをそのまま踏襲した
        // 高度(ft)→色相(0-359°)の折れ線補間。彩度88%・明度50%は固定
        // (28段の知覚補正テーブルは、本アプリのアイコンサイズでは効果が
        //  薄く保守コストに見合わないため省略。詳細は会話履歴を参照)
        const ALTITUDE_HUE_STOPS = [
            { alt: 0,     hue: 20 },   // オレンジ
            { alt: 2000,  hue: 32.5 },
            { alt: 4000,  hue: 43 },
            { alt: 6000,  hue: 54 },
            { alt: 8000,  hue: 72 },
            { alt: 9000,  hue: 85 },
            { alt: 11000, hue: 140 },  // 緑
            { alt: 40000, hue: 300 },  // 紫/マゼンタ
            { alt: 51000, hue: 360 },  // 赤(0°と同じ)
        ];

        function altitudeToColor(altitude) {
            if (altitude === null || altitude === undefined) {
                return 'hsl(0, 0%, 75%)';   // 高度不明
            }
            if (altitude <= 0) {
                return 'hsl(220, 0%, 30%)'; // 地上待機(s:0のため色相は実質無視される)
            }

            const stops = ALTITUDE_HUE_STOPS;
            if (altitude <= stops[0].alt) {
                return `hsl(${stops[0].hue}, 88%, 50%)`;
            }
            if (altitude >= stops[stops.length - 1].alt) {
                return 'hsl(0, 88%, 50%)'; // 360°は0°と同じ(赤)
            }
            for (let i = 0; i < stops.length - 1; i++) {
                if (altitude >= stops[i].alt && altitude <= stops[i + 1].alt) {
                    const range = stops[i + 1].alt - stops[i].alt;
                    const progress = (altitude - stops[i].alt) / range;
                    const hue = stops[i].hue + (stops[i + 1].hue - stops[i].hue) * progress;
                    return `hsl(${hue}, 88%, 50%)`;
                }
            }
            return `hsl(${stops[0].hue}, 88%, 50%)`; // 理論上到達しないフォールバック
        }

        function createPlaneIcon(heading, altitude) {
            const h = heading || 0;
            const color = altitudeToColor(altitude);
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
                style="transform: rotate(${h}deg); transform-origin: center;">
                <path fill="${color}" d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
            </svg>`;
            return L.divIcon({
                html: svg,
                className: 'flight-icon',
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });
        }

        function showError(msg) {
            const el = document.getElementById('error-msg');
            if (msg) {
                el.textContent = msg;
                el.classList.add('visible');
            } else {
                el.classList.remove('visible');
            }
        }

        // === bounds(地図の表示範囲)取得 ===
        function normalizeLng(lng) {
            // -180〜180の範囲に正規化
            return ((lng + 180) % 360 + 360) % 360 - 180;
        }
        
        function getCurrentBoundsParam() {
            if (activeRegionBounds) {
                const r = activeRegionBounds;
                return `${r.tl_y},${r.tl_x},${r.br_y},${r.br_x}`;
            }
            const b = map.getBounds();
            const tl_y = b.getNorth();
            const tl_x = normalizeLng(b.getWest());
            const br_y = b.getSouth();
            const br_x = normalizeLng(b.getEast());
            return `${tl_y},${tl_x},${br_y},${br_x}`;
        }
        
        /*
        function getCurrentBoundsParam() {
            const b = map.getBounds();
            const tl_y = b.getNorth();
            const tl_x = normalizeLng(b.getWest());
            const br_y = b.getSouth();
            const br_x = normalizeLng(b.getEast());

function findNearestRegion(lat, lng) {
    let nearest = null;
    let minDist = Infinity;
    for (const [key, r] of Object.entries(REGIONS)) {
        const centerLat = (r.tl_y + r.br_y) / 2;
        const centerLng = (r.tl_x + r.br_x) / 2;
        const dist = Math.sqrt((lat - centerLat) ** 2 + (lng - centerLng) ** 2);
        if (dist < minDist) {
            minDist = dist;
            nearest = key;
        }
    }
    return nearest;
}

async function searchByRegistration() {
    const input = document.getElementById('registration-search');
    const registration = input.value.trim().toUpperCase();
    if (!registration) return;

    showError('');
    try {
        const response = await fetch(`${API_BASE}/search?registration=${encodeURIComponent(registration)}`);
        if (!response.ok) {
            const data = await response.json();
            throw new Error(data.detail || data.error || `HTTP ${response.status}`);
        }
        const flight = await response.json();

        map.setView([flight.lat, flight.lng], 8);

        // 検索でヒットした機体をtooltip表示対象にする。
        // 監視リストには入れない(サイドバーの監視タグや通知の対象外)が、
        // checkWatchList()が次のポーリングでこの値も見てtooltipを出す。
        // map.setView()はmoveendを発火させ、800ms後にfetchFlights()が
        // 新しい表示範囲でこの機体を含めて取得するはずなので、
        // 数百ms〜1秒程度でtooltipが現れる。
        searchHighlightValue = registration;

        const nearestRegion = findNearestRegion(flight.lat, flight.lng);
        const regionLabel = REGION_LABELS[nearestRegion] || '不明';

        alert(`${registration} を検出しました(${flight.callsign || 'コールサイン不明'})\n最寄りリージョン: ${regionLabel}`);
    } catch (error) {
        console.error('登録番号検索エラー:', error);
        showError(`検索失敗: ${error.message}`);
    }
}
        function jumpToRegion(key) {

            const bounds = L.latLngBounds([r.br_y, r.tl_x], [r.tl_y, r.br_x]);

        async function fetchFlights() {
            try {
                showError('');
                const boundsParam = getCurrentBoundsParam();
                const response = await fetch(`${API_BASE}/flights?bounds=${encodeURIComponent(boundsParam)}`);
                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.detail || data.error || `HTTP ${response.status}`);
                }
                const flights = await response.json();

                allFlights = flights;
                filterFlights();
                checkWatchList(flights);

                document.getElementById('last-update').textContent =
                    `最終更新: ${new Date().toLocaleTimeString()}`;
            } catch (error) {
                console.error('フライト取得エラー:', error);
                showError(`取得失敗: ${error.message}`);
            }
        }

        function filterFlights() {
            const query = document.getElementById('search-box').value.trim().toLowerCase();
            const filtered = query
                ? allFlights.filter(f => {
                    const text = `${f.callsign || ''} ${f.airline || ''} ${f.aircraft || ''} ${f.registration || ''}`.toLowerCase();
                    return text.includes(query);
                  })
                : allFlights;
            updateMap(filtered);
            updateInfo(filtered.length, allFlights.length, query);
        }

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
}

function buildPhotoSection(photoState, flightId, dismissed) {
    if (!photoState || dismissed) return '';

    if (photoState.status === 'loading') {
        return `
            <div class="flight-photo">
                <div class="photo-loading"><span class="photo-spinner"></span>写真を確認中...</div>
            </div>
        `;
    }

    if (photoState.status === 'found') {
        const isSafeUrl = (u) => typeof u === 'string' && /^https?:\/\//i.test(u);
        if (!isSafeUrl(photoState.thumbnail_url)) return '';

        const url = escapeHtml(photoState.thumbnail_url);
        const link = isSafeUrl(photoState.link) ? escapeHtml(photoState.link) : '#';
        const photographer = escapeHtml(photoState.photographer || 'Unknown');
        const safeFlightId = escapeHtml(String(flightId));
        return `
            <div class="flight-photo">
                <button class="photo-close-btn" data-flight-id="${safeFlightId}" onclick="dismissAircraftPhoto(this.dataset.flightId)" title="写真を閉じる">×</button>
                <a href="${link}" target="_blank" rel="noopener noreferrer">
                    <img src="${url}" alt="機体写真" loading="lazy">
                    <div class="photo-credit">Photo by ${photographer} / planespotters.net</div>
                </a>
            </div>
        `;
    }

    // status === 'notfound'
    const safeFlightId = escapeHtml(String(flightId));
    return `
        <div class="flight-photo">
            <button class="photo-close-btn" data-flight-id="${safeFlightId}" onclick="dismissAircraftPhoto(this.dataset.flightId)" title="閉じる">×</button>
            <div class="photo-placeholder">📷 写真なし</div>
        </div>
    `;
}

function buildPopupContent(flight, loading = false, photoState = null, photoDismissed = false) {
    const codeRow = (flight.origin_icao || flight.origin_iata)
        ? `
            <div class="code-row">
                <span class="icao-badge">${flight.origin_icao || '----'}</span>
                <span class="iata-badge">${flight.origin_iata || '-'}</span>
                <span class="code-arrow">→</span>
                <span class="icao-badge">${flight.destination_icao || '----'}</span>
                <span class="iata-badge">${flight.destination_iata || '-'}</span>
            </div>
        `
        : '';

    return `
        <div class="flight-popup">
            <h3>✈️ ${flight.callsign || 'Unknown'}</h3>
            <p><strong>航空会社:</strong> ${flight.airline || 'Unknown'}</p>
            <p><strong>機種:</strong> ${flight.aircraft || 'Unknown'}</p>
            <p><strong>登録番号:</strong> ${flight.registration || 'N/A'}</p>
            <div class="route">${flight.origin || 'N/A'} → ${flight.destination || 'N/A'}</div>
            <p><strong>高度:</strong> ${flight.altitude ? flight.altitude + ' ft' : 'N/A'}</p>
            <p><strong>速度:</strong> ${flight.speed ? flight.speed + ' kts' : 'N/A'}</p>
            <p><strong>方位:</strong> ${flight.heading || 0}°</p>
            ${codeRow}
            ${loading ? '<p class="loading-note">詳細情報を取得中...</p>' : ''}
            ${buildPhotoSection(photoState, flight.id, photoDismissed)}
        </div>
    `;
}

        // === 航跡(ポリライン)描画 ===
        // Leafletのpolylineは1本につき単色しか持てないため、高度に応じた
        // グラデーションを表現するには2点ごとの短いセグメントに分割し、
        // セグメントごとにaltitudeToColor()の色を設定する(アイコンの
        // 高度配色と表現を揃えるため)。セグメント色は両端点の高度の
        // 平均値で決定(片方欠損時はもう片方の高度を採用)
        function drawTrail(flightId, trailPoints) {
            removeTrail(flightId);

            if (!trailPoints || trailPoints.length < 2) return;

            const points = trailPoints.filter(p => p.lat != null && p.lng != null);
            if (points.length < 2) return;

            const segments = [];
            for (let i = 0; i < points.length - 1; i++) {
                const p1 = points[i];
                const p2 = points[i + 1];
                const alt1 = p1.alt;
                const alt2 = p2.alt;
                const segAlt = (alt1 != null && alt2 != null) ? (alt1 + alt2) / 2
                             : (alt1 != null ? alt1 : alt2);

                const segment = L.polyline([[p1.lat, p1.lng], [p2.lat, p2.lng]], {
                    color: altitudeToColor(segAlt),
                    weight: 3,
                    opacity: 0.5
                }).addTo(map);
                segments.push(segment);
            }

            trailPolylines[flightId] = segments;
        }

        function removeTrail(flightId) {
            if (trailPolylines[flightId]) {
                trailPolylines[flightId].forEach(seg => map.removeLayer(seg));
                delete trailPolylines[flightId];
            }
        }

        // registration -> photoState のキャッシュ({status:'found'|'notfound', ...})
        // 同じ機体を何度ポップアップ開閉しても再取得しないためのクライアント側キャッシュ
        // (サーバー側にも24時間キャッシュがあるので二重防御)
        const photoCache = new Map();

        function renderPopup(marker) {
            marker.setPopupContent(
                buildPopupContent(marker._currentFlight, marker._detailLoading, marker._photoState, marker._photoDismissed)
            );
        }

        function dismissAircraftPhoto(flightId) {
            const marker = flightMarkers[flightId];
            if (!marker) return;
            marker._photoDismissed = true;
            // 重要: setPopupContent()をこのクリックハンドラ内で同期的に呼ぶと、
            // Leafletがクリックされた要素からポップアップの外枠まで親を辿って
            // 「ポップアップ内のクリックか」を判定する処理より先にDOMが
            // 差し替えられてしまい、判定に失敗してポップアップごと閉じてしまう。
            // 1tick遅らせることでLeaflet側の判定を先に完了させる。
            setTimeout(() => renderPopup(marker), 0);
        }

        async function loadAircraftPhoto(registration, marker) {
            const reg = (registration || '').trim().toUpperCase();

            if (!reg || reg === 'N/A') {
                marker._photoState = { status: 'notfound' };
                renderPopup(marker);
                return;
            }

            if (photoCache.has(reg)) {
                marker._photoState = photoCache.get(reg);
                renderPopup(marker);
                return;
            }

            marker._photoState = { status: 'loading' };
            renderPopup(marker);

            let result;
            try {
                const response = await fetch(`${API_BASE}/photo/${encodeURIComponent(reg)}`);
                if (!response.ok) {
                    result = { status: 'notfound' };
                } else {
                    const data = await response.json();
                    result = data.found
                        ? {
                            status: 'found',
                            thumbnail_url: data.thumbnail_url,
                            photographer: data.photographer,
                            link: data.link,
                          }
                        : { status: 'notfound' };
                }
            } catch (error) {
                console.error('写真取得エラー:', error);
                result = { status: 'notfound' };
            }

            photoCache.set(reg, result);

            // ポップアップが閉じられていても marker._photoState 自体は更新しておく
            // (再度開いたときにキャッシュとして即反映される)
            marker._photoState = result;
            if (marker.isPopupOpen()) {
                renderPopup(marker);
            }
        }

        async function loadFlightDetails(flightId, marker) {
            try {
                const boundsParam = getCurrentBoundsParam();
                const response = await fetch(`${API_BASE}/flight/${flightId}?bounds=${encodeURIComponent(boundsParam)}`);
                if (!response.ok) return; // 失敗時は基本情報のまま(フォールバック)
                const detail = await response.json();
                marker._currentFlight = detail;
                marker._detailLoading = false;
                renderPopup(marker);
                drawTrail(flightId, detail.trail);
            } catch (error) {
                console.error('詳細取得エラー:', error);
                marker._detailLoading = false;
                renderPopup(marker);
            }
        }

        function updateMap(flights) {
            const currentIds = new Set(flights.map(f => f.id));
            for (const id in flightMarkers) {
                if (!currentIds.has(id)) {
                    map.removeLayer(flightMarkers[id]);
                    delete flightMarkers[id];
                    removeTrail(id);
                }
            }
            flights.forEach(flight => {
                const pos = [flight.lat, flight.lng];
                const heading = flight.heading || 0;
                if (flightMarkers[flight.id]) {
                    flightMarkers[flight.id].setLatLng(pos);
                    flightMarkers[flight.id].setIcon(createPlaneIcon(heading, flight.altitude));
                    flightMarkers[flight.id]._basicFlight = flight;
                } else {
                    const marker = L.marker(pos, { icon: createPlaneIcon(heading, flight.altitude) }).addTo(map);
                    marker._basicFlight = flight;
                    marker._currentFlight = flight;
                    marker._detailLoading = false;
                    marker._photoState = null;
                    marker._photoDismissed = false;
                    marker.bindPopup(buildPopupContent(flight));

                    marker.on('popupopen', () => {
                        marker._currentFlight = marker._basicFlight;
                        marker._detailLoading = true;
                        marker._photoDismissed = false;
                        renderPopup(marker);

                        loadFlightDetails(flight.id, marker);
                        loadAircraftPhoto(marker._basicFlight.registration, marker);
                    });

                    marker.on('popupclose', () => {
                        removeTrail(flight.id);
                    });

                    flightMarkers[flight.id] = marker;
                }
            });
        }

        function updateInfo(filteredCount, totalCount, query) {
            const el = document.getElementById('flight-count');
            if (query) {
                el.textContent = `表示: ${filteredCount} / 全${totalCount}件`;
            } else {
                el.textContent = `フライト数: ${totalCount}`;
            }
        }

        function refreshFlights() {
            fetchFlights();
        }

        // === 地図移動・ズーム時の再取得(デバウンス付き) ===
        let moveDebounceTimer = null;
        function onMapMoveEnd() {
            activeRegionBounds = null;  // ← この1行を追加(手動操作でリージョン固定を解除)
            clearTimeout(moveDebounceTimer);
            moveDebounceTimer = setTimeout(() => {
                fetchFlights();
            }, 800);
        }
        map.on('moveend', onMapMoveEnd);
        map.on('zoomend', onMapMoveEnd);

        setInterval(fetchFlights, 30000);
        renderWatchList();
        fetchFlights();
    </script>
